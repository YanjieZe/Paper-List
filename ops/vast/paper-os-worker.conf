[program:paper-os-worker]
command=/workspace/paper-list-research-os/repo/ops/vast/run-worker.sh
user=yanjie
directory=/workspace/paper-list-research-os/repo
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/paper-os-worker.log
stderr_logfile=/var/log/portal/paper-os-worker.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
environment=PROC_NAME="paper-os-worker"
