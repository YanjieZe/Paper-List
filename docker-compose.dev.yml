services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: paper_os
      POSTGRES_USER: paper_os
      POSTGRES_PASSWORD: paper_os_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - paper_os_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_os -d paper_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paper_os_postgres:
