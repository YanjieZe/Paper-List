[project]
name = "paper-list-worker"
version = "1.0.0"
description = "Research ingestion, agents, retrieval, and publication worker for Paper-List"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "httpx>=0.28.1",
  "openai>=1.100.0",
  "openai-agents>=0.2.0",
  "psycopg[binary,pool]>=3.2.9",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "pymupdf>=1.26.3",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.2",
  "tenacity>=9.1.2",
  "tiktoken>=0.11.0",
  "typer>=0.16.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.7"
]

[project.scripts]
paper-worker = "paper_worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
